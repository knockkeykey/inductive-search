<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>感应式搜索设置</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #111; }
  label { display: block; font-weight: 600; margin-top: 20px; }
  input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid #bbb; border-radius: 6px; margin-top: 6px; }
  small { color: #555; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; cursor: pointer; }
  .row input:focus { border-color: #d97706; outline: none; box-shadow: 0 0 0 2px rgba(217,119,6,.25); }
  button.secondary { margin-top: 6px; background: #fff; color: #111; }
  #shortcutNote { display: block; min-height: 1.2em; margin-top: 4px; }
  button.link { all: unset; color: #1d4ed8; text-decoration: underline; cursor: pointer; font: inherit; }
  button { margin-top: 20px; font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #333; background: #111; color: #fff; cursor: pointer; }
  #saved { margin-left: 10px; color: #15803d; }
</style></head>
<body>
  <h1>感应式搜索</h1>
  <p>仅当查找栏打开并提交搜索时，页面文字、网址、标题和搜索内容才会发送给你选择的服务商。</p>
  <label>API 服务商 <select id="provider" disabled><option value="typesafe">TypeSafe（官方）</option><option value="openrouter">OpenRouter（Jev）</option><option value="openlux">OpenLux（Jev）</option></select></label>
  <p id="nokey" style="display:none;padding:10px 12px;border-radius:6px;background:#fef3c7;color:#92400e">首次搜索前需要 API 密钥。请前往 <a id="keyLink" href="https://console.typesafe.ai/keys" target="_blank" rel="noreferrer">TypeSafe 密钥</a>创建密钥，粘贴到下方并保存。</p>
  <label><span id="keyLabel">TypeSafe API 密钥</span> <input id="apiKey" type="password" placeholder="apikey_…" autocomplete="off"></label>
  <label>模型 <small id="modelNote"></small>
    <select id="model"></select></label>
  <small>OpenRouter 和 OpenLux 使用 Jev 的 System One API，不支持 GPT、Claude 等聊天模型。每个服务商分别保存自己的密钥和模型。</small>
  <label>快捷键 <small id="shortcutHint">点击此处并按下想设置的组合键。</small>
    <span class="row">
      <input id="shortcut" type="text" readonly placeholder="…">
      <button id="resetShortcut" type="button" class="secondary">恢复默认</button>
    </span>
    <small id="shortcutNote"></small></label>
  <button id="save" type="button" disabled>保存</button><span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
