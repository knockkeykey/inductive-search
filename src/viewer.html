<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>文档 · 感应式搜索</title>
<link rel="stylesheet" href="content.css">
<style>
  :root {
    color-scheme: light dark;
    --label: rgba(0,0,0,.88); --secondary: rgba(60,60,67,.62); --separator: rgba(60,60,67,.16);
    --bg: #f5f5f7; --group: #fff; --fill: rgba(120,120,128,.12); --accent: #007aff; --orange: #c93400;
    --focus: rgba(0,122,255,.4);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --label: rgba(255,255,255,.92); --secondary: rgba(235,235,245,.6); --separator: rgba(84,84,88,.6);
      --bg: #1c1c1e; --group: #2c2c2e; --fill: rgba(120,120,128,.24); --accent: #0a84ff; --orange: #ff9f0a;
      --focus: rgba(10,132,255,.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--label);
    max-width: 820px; margin: 0 auto; padding: 28px 20px 64px;
  }
  body.dragging { outline: 3px dashed var(--accent); outline-offset: -12px; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  #docTitle { font-size: 20px; font-weight: 700; margin: 0; flex: 1; overflow-wrap: anywhere; }
  label.pick { font: 13px/28px inherit; height: 28px; padding: 0 14px; border-radius: 7px; background: var(--fill); cursor: pointer; }
  label.pick:focus-within { box-shadow: 0 0 0 3px var(--focus); }
  label.pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #status { color: var(--secondary); font-size: 13px; min-height: 1.5em; margin: 0 0 16px; }
  #status.error { color: var(--orange); }
  #grant { font: inherit; font-size: 13px; height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: var(--accent); color: #fff; font-weight: 600; margin-bottom: 16px; }
  #intro { background: var(--group); border-radius: 10px; box-shadow: 0 0 0 .5px var(--separator); padding: 28px; text-align: center; color: var(--secondary); }
  #doc { background: var(--group); border-radius: 10px; box-shadow: 0 0 0 .5px var(--separator); padding: 8px 36px 24px; }
  #doc:empty { display: none; }
  #doc .page h2 { font-size: 12px; font-weight: 600; color: var(--secondary); border-top: .5px solid var(--separator); padding-top: 12px; margin: 20px 0 8px; }
  #doc .page:first-child h2 { border-top: 0; }
  #doc img { max-width: 100%; height: auto; }
  #doc table { border-collapse: collapse; margin: 12px 0; }
  #doc td, #doc th { border: .5px solid var(--separator); padding: 4px 8px; vertical-align: top; }
  #doc a { color: var(--accent); }
</style></head>
<body>
  <header>
    <h1 id="docTitle">打开 PDF 或 Word 文档</h1>
    <label class="pick">选择文件<input id="file" type="file"></label>
  </header>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="grant" type="button" hidden>允许访问</button>
  <div id="intro">
    <p>选择或拖入 PDF、Word（.docx）文件。文档在本机转换成文字，只有点击“搜索”后，文字才会发送给你选择的服务商。</p>
  </div>
  <article id="doc"></article>
  <script type="module" src="viewer.js"></script>
  <script src="content.js"></script>
</body>
</html>
